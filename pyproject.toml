[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-aware-container-scheduler"
version = "0.1.0"
description = "A carbon-aware workload scheduling system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["docker>=7.1.0,<8.0.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88